name: Run tests

on:
  push:
    branches:
      - main
      - feature/mlb-phase1
      - feature/mlb-phase2
      - feature/mlb-phase3
      - feature/mlb-phase4
      - feature/mlb-phase5
      - feature/mlb-phase6
      - feature/mlb-phase7
      - feature/mlb-phase8
      - feature/mlb-phase9
      - feature/mlb-phase10
      - operations/mlb-paper-run
      - automation/mlb-paper-runs

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run full test suite
        id: test_suite
        run: |
          mkdir -p var
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee var/test-output.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test Our research adapter
        run: node --test research_adapter/test/*.test.js

      - name: Validate new NHL and CFB credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/revised-sports-strategy-2026-10-01'
        env:
          NHL_CFB_ODDS_API_KEY: ${{ secrets.NHL_CFB_ODDS_API_KEY }}
          CFBD_2_API_KEY: ${{ secrets.CFBD_2_API_KEY }}
        run: python scripts/collect_supplemental_research.py --check-connections --check-models

      - name: Send main-branch test result to Telegram
        # Keep software tests running, but do not send their results to Telegram.
        if: ${{ false }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_OUTCOME: ${{ steps.test_suite.outcome }}
        run: |
          python scripts/send_telegram_notification.py \
            --mode tests \
            --file var/test-output.txt \
            --outcome "$TEST_OUTCOME" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
